const SALT = 16, IV = 16, MAC = 32;
document.getElementById("pass").addEventListener("keydown", function(e){ if (e.key === "Enter") unlock(); });
var unlockedNow = false;
async function unlock(auto){
  var err = document.getElementById("err");
  err.textContent = "";
  var pass = document.getElementById("pass").value;
  if (auto) { pass = auto; document.getElementById("pass").value = auto; }
  if (!pass) { err.textContent = "Λάθος κωδικός"; return; }
  var raw;
  try { raw = Uint8Array.from(atob(PAYLOAD), function(c){ return c.charCodeAt(0); }); }
  catch(e){ err.textContent = "Bad page"; return; }
  var salt = raw.subarray(0, SALT);
  var iv = raw.subarray(SALT, SALT + IV);
  var mac = raw.subarray(SALT + IV, SALT + IV + MAC);
  var cipher = raw.subarray(SALT + IV + MAC);
  try {
    var pwKey = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), { name: "PBKDF2" }, false, ["deriveBits"]);
    var derived = await crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt: salt, iterations: 600000 }, pwKey, 512);
    var bytes = new Uint8Array(derived);
    var aesKey = bytes.slice(0, 32);
    var hmacKey = bytes.slice(32, 64);
    var macData = new Uint8Array(iv.length + cipher.length);
    macData.set(iv, 0);
    macData.set(cipher, iv.length);
    var hk = await crypto.subtle.importKey("raw", hmacKey, { name: "HMAC", hash: "SHA-256" }, false, ["verify"]);
    var ok = await crypto.subtle.verify("HMAC", hk, mac, macData);
    if (!ok) { err.textContent = "Λάθος κωδικός"; return; }
    var ak = await crypto.subtle.importKey("raw", aesKey, { name: "AES-CBC" }, false, ["decrypt"]);
    var pt = await crypto.subtle.decrypt({ name: "AES-CBC", iv: iv }, ak, cipher);
    var text = new TextDecoder().decode(pt);
    document.getElementById("content").innerHTML = text;
    document.getElementById("lock").style.display = "none";
    document.getElementById("content").style.display = "block";
    unlockedNow = true;
  } catch(e) { err.textContent = "Λάθος κωδικός"; }
}
if (!unlockedNow && location.hash.length > 1) { var p = decodeURIComponent(location.hash.substring(1)); document.getElementById("pass").value = p; unlock(p); }
